name: Import UCII Alexa v36 frontend
on:
  push:
    paths:
      - '.github/workflows/import-alexa-v36.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract website source safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path("ucii-alexa-control-source-v36.zip")
          destination = Path("frontend")
          target = destination / "ucii-alexa-control"
          if target.exists():
              raise SystemExit("Frontend already exists; refusing to overwrite.")
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p = Path(item.filename)
                  if p.is_absolute() or ".." in p.parts or not p.parts or p.parts[0] != "ucii-alexa-control":
                      raise SystemExit(f"Unsafe/unexpected path: {item.filename}")
                  if item.is_dir():
                      continue
                  if (item.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit(f"Symlink not allowed: {item.filename}")
              z.extractall(destination)
          ignore = target / ".gitignore"
          ignore.write_text(ignore.read_text() + "\n# TypeScript incremental build cache\n*.tsbuildinfo\n")
          print("Extracted:",len(z.namelist()),"entries")
          PY
      - name: Commit website source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/ucii-alexa-control/
          git diff --cached --check
          if git diff --cached --name-only | grep -qv '^frontend/'; then
            echo "Unexpected staged files"; exit 1
          fi
          git commit -m "Add UCII Alexa+ website v36 source"
          git push origin HEAD:main
